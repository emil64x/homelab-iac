services:
  mealie:
    image: ghcr.io/mealie-recipes/mealie:v3.9.2 # 
    container_name: mealie
    restart: always
    ports:
        - "9925:9000" # 
    deploy:
      resources:
        limits:
          memory: 1000M # 
    volumes:
      - ${STORAGE}/mealie-data:/app/data/
    environment:
      # Set Backend ENV Variables Here
      ALLOW_SIGNUP: "false"
      PUID: 1000
      PGID: 1000
      TZ: Europe/London
      BASE_URL: ${MEALIE_DNS}
      # Database Settings
      DB_ENGINE: postgres
      POSTGRES_USER: mealie
      POSTGRES_PASSWORD: mealie
      POSTGRES_SERVER: postgres
      POSTGRES_PORT: 5432
      POSTGRES_DB: mealie
      # OIDC Settings
      OIDC_AUTH_ENABLED: "true"
      OIDC_SIGNUP_ENABLED: "true"
      OIDC_CONFIGURATION_URL: "https://auth-e2.emil64.cc/application/o/mealie/.well-known/openid-configuration"
      OIDC_CLIENT_ID: ${MEALIE_OIDC_CLIENT_ID:-f3eeed94b5298e932b4586c129b76b78}
      OIDC_CLIENT_SECRET: ${MEALIE_OIDC_CLIENT_SECRET:-IRuUtAyFaditLzHjlJIkIPS5yT_yji-S9hQaz7TEI_w}
      OIDC_PROVIDER_NAME: "Authentik"
      OIDC_AUTO_REDIRECT: "false"
      OIDC_ADMIN_GROUP: "role-admin"
      OIDC_USER_GROUP: "app-mealie"
    depends_on:
      postgres:
        condition: service_healthy

  postgres:
    container_name: postgres
    image: postgres:17
    restart: always
    volumes:
      - ${STORAGE}/mealie-pgdata:/var/lib/postgresql/data
    environment:
      POSTGRES_PASSWORD: mealie
      POSTGRES_USER: mealie
      PGUSER: mealie
      POSTGRES_DB: mealie
    healthcheck:
      test: ["CMD", "pg_isready"]
      interval: 30s
      timeout: 20s
      retries: 3
