services:
  actual_server:
    image: docker.io/actualbudget/actual-server:latest
    container_name: actual_server
    ports:
      - "5006:5006"
    volumes:
      - ${STORAGE}/actual-budget/data:/data
    environment:
      ACTUAL_OPENID_DISCOVERY_URL: https://auth-e2.emil64.cc/application/o/actual-budget/.well-known/openid-configuration
      ACTUAL_OPENID_CLIENT_ID: ${ACTUAL_OPENID_CLIENT_ID:-e84f526a01bb89be299683f6b557cadc}
      ACTUAL_OPENID_CLIENT_SECRET: ${ACTUAL_OPENID_CLIENT_SECRET:-8ySzw5_cUpOMfpvsU0je58TIXXN__sACYuunIFPYnwc}
      ACTUAL_OPENID_SERVER_HOSTNAME: https://actual-e2.emil64.cc
      ACTUAL_OPENID_PROVIDER_NAME: Authentik
      ACTUAL_OPENID_AUTH_METHOD: openid
      ACTUAL_OPENID_ENFORCE: "false"
      ACTUAL_USER_CREATION_MODE: login
    healthcheck:
      test: ["CMD-SHELL", "node src/scripts/health-check.js"]
      interval: 60s
      timeout: 10s
      retries: 3
      start_period: 20s
    restart: unless-stopped
