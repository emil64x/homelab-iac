services:
  homepage:
    image: ghcr.io/gethomepage/homepage:latest
    container_name: homepage
    ports:
      - "3200:3000"
    volumes:
      - ${STORAGE}/homepage/config:/app/config
      - /var/run/docker.sock:/var/run/docker.sock
    restart: always
    environment:
      - HOMEPAGE_ALLOWED_HOSTS=${HOMEPAGE_ALLOWED_HOSTS}
