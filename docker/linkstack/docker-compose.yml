services:

  linkstack:
    hostname: 'linkstack'
    image: 'linkstackorg/linkstack:latest'
    environment:
      TZ: 'Europe/London'
      LOG_LEVEL: 'debug'
      PHP_MEMORY_LIMIT: '256M'
      UPLOAD_MAX_FILESIZE: '8M'
    volumes:
      - '${STORAGE}/linkstack_data/data:/storage'
    ports:
      - '8490:80'
    restart: unless-stopped
