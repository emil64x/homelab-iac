services:
  postgres:
    restart: always
    image: pgvector/pgvector:pg18
    labels:
      - "com.centurylinklabs.watchtower.enable=false"
    volumes:
      - postgres:/var/lib/postgresql
    environment:
      - POSTGRES_PASSWORD=postgres
      - POSTGRES_DB=formbricks
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres || exit 1"]
      interval: 5s
      timeout: 3s
      retries: 30
      start_period: 30s

  redis:
    restart: always
    image: valkey/valkey@sha256:12ba4f45a7c3e1d0f076acd616cb230834e75a77e8516dde382720af32832d6d
    labels:
      - "com.centurylinklabs.watchtower.enable=false"
    command: valkey-server --appendonly yes --maxmemory-policy noeviction
    volumes:
      - redis:/data
    healthcheck:
      test: ["CMD", "valkey-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 30
      start_period: 10s

  formbricks:
    restart: always
    image: ghcr.io/formbricks/formbricks:5.4.9
    labels:
      - "com.centurylinklabs.watchtower.enable=false"
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      cube:
        condition: service_healthy
    ports:
      - "3233:3000"
    volumes:
      - ${STORAGE}/formbricks/saml-connection:/home/nextjs/apps/web/saml-connection
    environment:
      WEBAPP_URL: ${WEBAPP_URL}
      NEXTAUTH_URL: ${NEXTAUTH_URL}
      DATABASE_URL: "postgresql://postgres:postgres@postgres:5432/formbricks?schema=public"
      NEXTAUTH_SECRET: ${NEXTAUTH_SECRET}
      ENCRYPTION_KEY: ${ENCRYPTION_KEY}
      CRON_SECRET: ${CRON_SECRET}
      REDIS_URL: "redis://redis:6379"
      HUB_API_KEY: ${HUB_API_KEY}
      HUB_API_URL: "http://hub:8080"
      CUBEJS_API_URL: "http://cube:4000"
      CUBEJS_API_SECRET: ${CUBEJS_API_SECRET}
      CUBEJS_JWT_ISSUER: formbricks-web
      CUBEJS_JWT_AUDIENCE: formbricks-cube
      MAIL_FROM: forms@emil64.cc
      SMTP_HOST: smtp.zoho.com
      SMTP_PORT: 465
      SMTP_USER: forms@emil64.cc
      SMTP_PASSWORD: ${SMTP_PASSWORD}
      SMTP_SECURE_ENABLED: 1
      EMAIL_VERIFICATION_DISABLED: 1
      PASSWORD_RESET_DISABLED: 1

  hub-migrate:
    image: ghcr.io/formbricks/hub:latest
    restart: "no"
    entrypoint: ["sh", "-c"]
    command:
      [
        'if [ -x /usr/local/bin/goose ] && [ -x /usr/local/bin/river ]; then /usr/local/bin/goose -dir /app/migrations postgres "$$DATABASE_URL" up && /usr/local/bin/river migrate-up --database-url "$$DATABASE_URL"; else echo ''Migration tools (goose/river) not in image.''; exit 1; fi',
      ]
    environment:
      DATABASE_URL: postgresql://postgres:postgres@postgres:5432/formbricks?sslmode=disable
    depends_on:
      postgres:
        condition: service_healthy

  hub:
    restart: always
    image: ghcr.io/formbricks/hub:latest
    depends_on:
      hub-migrate:
        condition: service_completed_successfully
      postgres:
        condition: service_healthy
    environment:
      API_KEY: ${HUB_API_KEY}
      DATABASE_URL: postgresql://postgres:postgres@postgres:5432/formbricks?sslmode=disable

  cube:
    restart: always
    image: cubejs/cube:v1.6.6
    depends_on:
      hub-migrate:
        condition: service_completed_successfully
      postgres:
        condition: service_healthy
    environment:
      CUBEJS_DB_TYPE: postgres
      CUBEJS_DB_HOST: postgres
      CUBEJS_DB_NAME: formbricks
      CUBEJS_DB_USER: postgres
      CUBEJS_DB_PASS: postgres
      CUBEJS_DB_PORT: 5432
      CUBEJS_API_SECRET: ${CUBEJS_API_SECRET}
      CUBEJS_JWT_ISSUER: formbricks-web
      CUBEJS_JWT_AUDIENCE: formbricks-cube
      CUBEJS_DEFAULT_API_SCOPES: meta,data
      CUBEJS_CACHE_AND_QUEUE_DRIVER: memory
    volumes:
      - ${STORAGE}/formbricks/cube/cube.js:/cube/conf/cube.js:ro
      - ${STORAGE}/formbricks/cube/schema:/cube/conf/model:ro
    healthcheck:
      test:
        [
          "CMD",
          "node",
          "-e",
          "require('http').get('http://127.0.0.1:4000/readyz', (res) => { res.resume(); process.exit(res.statusCode === 200 ? 0 : 1); }).on('error', () => process.exit(1));",
        ]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 30s

volumes:
  postgres:
    driver: local
  redis:
    driver: local
