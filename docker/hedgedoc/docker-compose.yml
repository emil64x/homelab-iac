version: '3'
services:
  database:
    image: postgres:17.7-alpine
    environment:
      - POSTGRES_USER=hedgedoc
      - POSTGRES_PASSWORD=password
      - POSTGRES_DB=hedgedoc
    volumes:
      - ${STORAGE}/hedgedoc/database:/var/lib/postgresql/data
    restart: always
  app:
    image: quay.io/hedgedoc/hedgedoc:1.10.5
    environment:
      - CMD_DB_URL=postgres://hedgedoc:password@database:5432/hedgedoc
      - CMD_DOMAIN=${HEDGEDOC_DOMAIN}
      - CMD_PROTOCOL_USESSL=true
      - CMD_URL_ADDPORT=false
      - CMD_ALLOW_ORIGIN=['${HEDGEDOC_DOMAIN}']
      - CMD_OAUTH2_USER_PROFILE_URL=${HEDGEDOC_OAUTH2_USER_PROFILE_URL}
      - CMD_OAUTH2_AUTHORIZATION_URL=${HEDGEDOC_OAUTH2_AUTHORIZATION_URL}
      - CMD_OAUTH2_TOKEN_URL=${HEDGEDOC_OAUTH2_TOKEN_URL}
      - CMD_OAUTH2_CLIENT_ID=${HEDGEDOC_OIDC_CLIENT_ID}
      - CMD_OAUTH2_CLIENT_SECRET=${HEDGEDOC_OIDC_CLIENT_SECRET}
      - CMD_OAUTH2_PROVIDERNAME=Authentik
      - CMD_OAUTH2_SCOPE=openid email profile
      - CMD_OAUTH2_USER_PROFILE_ID_ATTR=sub
      - CMD_OAUTH2_USER_PROFILE_USERNAME_ATTR=preferred_username
      - CMD_OAUTH2_USER_PROFILE_DISPLAY_NAME_ATTR=name
      - CMD_OAUTH2_USER_PROFILE_EMAIL_ATTR=email
    volumes:
      - ${STORAGE}/hedgedoc/uploads:/hedgedoc/public/uploads
    ports:
      - "${HEDGEDOC_PORT}:3000"
    restart: always
    depends_on:
      - database
